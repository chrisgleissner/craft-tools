name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  checks:
    uses: ./.github/workflows/test.yml
  publish:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Package tracked source
        run: bash scripts/package-release.sh "$GITHUB_REF_NAME" dist
      - name: Verify package
        run: |
          cd dist
          sha256sum --check SHA256SUMS
          unpack=$(mktemp -d)
          tar -xzf "craft-tools-$GITHUB_REF_NAME.tar.gz" -C "$unpack"
          "$unpack/craft-tools-$GITHUB_REF_NAME/craft" --help
          "$unpack/craft-tools-$GITHUB_REF_NAME/craft" --list
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/craft-tools-$GITHUB_REF_NAME.tar.gz" dist/SHA256SUMS \
            --verify-tag --generate-notes --title "Craft Tools $GITHUB_REF_NAME"
